<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura App</title>
    <!-- Legăm noul fișier CSS pentru arta arboricolă -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="glass-panel">
        <h2 style="color: var(--accent-color); margin-top: 0; font-size: 2em;">🌸 Sakura</h2>
        <input type="text" id="logUser" placeholder="Nume utilizator" onkeypress="if(event.key === 'Enter') doLogin()">
        <input type="password" id="logPass" placeholder="Parolă" onkeypress="if(event.key === 'Enter') doLogin()">
        <button id="btnLogin" onclick="doLogin()">Autentificare</button>
        <span class="switch-link" onclick="showScreen('register-screen')">Nu ai cont? Creează-ți Grădina</span>
    </div>

    <!-- REGISTER SCREEN -->
    <div id="register-screen" class="glass-panel" style="display: none;">
        <h2 style="color: var(--accent-color); margin-top: 0;">Creează Grădină</h2>
        <input type="text" id="regUser" placeholder="Nume utilizator" onkeypress="if(event.key === 'Enter') doRegister()">
        <input type="password" id="regPass" placeholder="Parolă" onkeypress="if(event.key === 'Enter') doRegister()">
        <div style="text-align: left; margin-bottom: 5px; color: #aaa; font-size: 0.9em;">Culoare profil:</div>
        <input type="color" id="regColor" value="#ffb7c5" style="padding: 2px; height: 40px; cursor: pointer; border-radius: 8px;">
        <button id="btnRegister" onclick="doRegister()">Înregistrare</button>
        <span class="switch-link" onclick="showScreen('login-screen')">Înapoi la Autentificare</span>
    </div>

    <!-- APP SCREEN -->
    <div id="app-screen">
        <div class="header-bar">
            <h2>Bun venit, <span id="welcome-name" style="color: var(--accent-color);"></span>!</h2>
            <button class="btn-logout" onclick="doLogout()">Deconectare</button>
        </div>

        <div class="glass-panel dashboard">
            <h3 style="margin-top: 0;">Obiceiuri Zilnice (Max 6)</h3>
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <input type="text" id="taskName" placeholder="Ex: Sală, Citit, Apă" style="margin:0;" onkeypress="if(event.key === 'Enter') addTask()">
                <button onclick="addTask()" style="width: auto; padding: 0 20px;">Adaugă</button>
            </div>
            
            <div id="taskList" style="display: flex; flex-direction: column; gap: 12px;"></div>
            
            <!-- Butonul ascuns, disponibil doar pentru admin/matei/test -->
            <button id="btn-simulate" onclick="simulateNextDay()" style="display: none; margin-top: 30px; background: transparent; border: 1px dashed var(--accent-color); color: var(--accent-color);">
                ⏩ Simulează Ziua Următoare (Test)
            </button>
        </div>

        <!-- SAKURA TREE ART CONTAINER -->
        <div class="glass-panel tree-area">
            <div class="trunk" id="treeTrunk">
                <div class="face" id="treeFace">😴</div>
            </div>
            <!-- Container pentru petalele animate -->
            <div id="petalContainer"></div>
        </div>
    </div>

    <script>
        // --- 1. LOGICĂ DE AUTENTIFICARE ȘI PERMISIUNI ---
        const ALLOWED_ADMINS = ['admin', 'matei', 'test'];
        let currentUser = "";

        function evaluatePermissions(username) {
            currentUser = username;
            const btnSimulate = document.getElementById('btn-simulate');
            // Verificăm ignorând majusculele/minusculele
            if (ALLOWED_ADMINS.includes(username.toLowerCase())) {
                btnSimulate.style.display = 'block';
            } else {
                btnSimulate.style.display = 'none';
            }
        }

        async function checkSession() {
            const token = localStorage.getItem('sakura_token');
            if(!token) return showScreen('login-screen');

            try {
                const res = await fetch('/api/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({token})});
                const data = await res.json();
                
                if(data.valid) {
                    document.getElementById('welcome-name').innerText = data.username;
                    evaluatePermissions(data.username);
                    showScreen('app-screen');
                    updateUI(); 
                } else {
                    localStorage.removeItem('sakura_token');
                    showScreen('login-screen');
                }
            } catch (error) {
                console.error("Eroare la verificare:", error);
                showScreen('login-screen');
            }
        }

        async function doLogin() {
            const u = document.getElementById('logUser').value.trim();
            const p = document.getElementById('logPass').value;
            const btn = document.getElementById('btnLogin');

            if(!u || !p) return alert("Introdu username și parola!");

            btn.disabled = true;
            btn.innerText = "Se încarcă...";

            try {
                const res = await fetch('/api/login', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({username: u, password: p})
                });
                
                const data = await res.json();
                
                if(data.success) { 
                    localStorage.setItem('sakura_token', data.token); 
                    checkSession(); 
                } else {
                    alert(data.error || "Eroare la logare.");
                }
            } catch (error) {
                alert("Eroare server. Verifică Podman-ul.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Autentificare";
            }
        }

        async function doRegister() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const c = document.getElementById('regColor').value;
            const btn = document.getElementById('btnRegister');

            if(!u || !p) return alert("Completează username și parola!");

            btn.disabled = true;
            btn.innerText = "Se încarcă...";

            try {
                const res = await fetch('/api/register', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({username: u, password: p, color: c})
                });
                
                const data = await res.json();
                if(data.success) { 
                    alert(data.message); 
                    showScreen('login-screen'); 
                } else {
                    alert(data.error || "Eroare la înregistrare.");
                }
            } catch (error) {
                alert("Eroare server.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Înregistrare";
            }
        }

        function doLogout() { localStorage.removeItem('sakura_token'); window.location.reload(); }
        
        function showScreen(id) { 
            ['login-screen', 'register-screen', 'app-screen'].forEach(s => document.getElementById(s).style.display = 'none'); 
            document.getElementById(id).style.display = (id==='app-screen')?'flex':'block'; 
        }

        // --- 2. LOGICĂ ARBORE SAKURA ȘI UI ---
        let tasks = [];

        // Configurarea pozițiilor fizice ale ramurilor pe trunchi (pentru a arăta natural)
        const branchConfig = [
            { width: '120px', top: '30px', side: 'left', transform: 'rotate(-35deg)', origin: 'right center' },
            { width: '110px', top: '60px', side: 'right', transform: 'rotate(25deg)', origin: 'left center' },
            { width: '140px', top: '100px', side: 'left', transform: 'rotate(-20deg)', origin: 'right center' },
            { width: '130px', top: '130px', side: 'right', transform: 'rotate(15deg)', origin: 'left center' },
            { width: '90px', top: '170px', side: 'left', transform: 'rotate(-10deg)', origin: 'right center' },
            { width: '100px', top: '190px', side: 'right', transform: 'rotate(10deg)', origin: 'left center' }
        ];
        
        function updateUI() {
            const taskList = document.getElementById('taskList');
            const trunk = document.getElementById('treeTrunk');
            const face = document.getElementById('treeFace');
            
            taskList.innerHTML = '';
            
            // Curățăm ramurile vechi
            Array.from(trunk.children).forEach(child => { if(child.id !== 'treeFace') trunk.removeChild(child); });

            if(tasks.length === 0) { 
                taskList.innerHTML = '<div style="color:#888; text-align:center;">Niciun obicei creat încă. Începe să îți crești grădina!</div>'; 
                face.innerText = '😴'; 
                generatePetals(0); // Curățăm petalele
                return; 
            }

            let allCompletedToday = true;
            let totalStreak = 0;

            tasks.forEach((task, index) => {
                if(!task.completedToday) allCompletedToday = false;
                totalStreak += task.streak;

                // Randare listă UI
                taskList.innerHTML += `
                <div style="background:rgba(0,0,0,0.3); padding:12px; border-left:4px solid ${task.completedToday ? '#4caf50' : 'var(--accent-color)'}; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <b style="font-size:1.1em;">${task.name}</b><br>
                        <small style="color:#aaa;">🔥 Seria: ${task.streak} zile</small>
                    </div>
                    <button onclick="completeTask(${index})" style="width:auto; padding:8px 15px; background:${task.completedToday ? '#4caf50' : 'transparent'}; border:2px solid ${task.completedToday ? '#4caf50' : 'var(--accent-color)'}; color:${task.completedToday ? '#fff' : 'var(--accent-color)'}" ${task.completedToday ? 'disabled' : ''}>
                        ${task.completedToday ? 'Irigat ✓' : 'Udă 💧'}
                    </button>
                </div>`;

                // Calculare nivel înflorire pentru CSS
                let levelClass = task.streak >= 20 ? 'level-3' : task.streak >= 10 ? 'level-2' : task.streak > 0 ? 'level-1' : 'level-0';
                
                // Construirea ramurii fizice cu artă CSS
                let conf = branchConfig[index];
                let isLeft = conf.side === 'left';
                
                // Corectăm textul să nu stea cu capul în jos
                let antiRotate = isLeft ? `rotate(35deg)` : `rotate(-25deg)`;

                trunk.innerHTML += `
                <div class="branch" style="width: ${conf.width}; top: ${conf.top}; ${isLeft ? 'left: -'+conf.width : 'right: -'+conf.width}; transform: ${conf.transform}; transform-origin: ${conf.origin}; flex-direction: ${isLeft ? 'row-reverse' : 'row'};">
                    <div class="post-it" style="transform: ${antiRotate}; ${isLeft ? 'margin-left: 10px;' : 'margin-right: 10px;'}">${task.name}</div>
                    <div class="blossom-node ${levelClass}"></div>
                </div>`;
            });

            // Reacții ale copacului
            if (allCompletedToday) face.innerText = '😊';
            else if (tasks.some(t => t.streak === 0 && !t.completedToday)) face.innerText = '😢';
            else face.innerText = '😐';

            // Generăm ploaia de petale proporțional cu seria totală
            generatePetals(totalStreak);
        }

        function generatePetals(streakSum) {
            const container = document.getElementById('petalContainer');
            container.innerHTML = ''; // Reset
            
            if (streakSum === 0) return;

            // Maxim 40 de petale pe ecran pentru performanță
            let petalCount = Math.min(streakSum, 40);

            for(let i=0; i < petalCount; i++) {
                let petal = document.createElement('div');
                petal.className = 'petal';
                // Generare random pentru naturalețe
                petal.style.left = (Math.random() * 100) + '%';
                // Viteza de cădere și balansare random
                let fallDuration = (Math.random() * 4 + 4); 
                let swayDuration = (Math.random() * 2 + 2);
                let delay = Math.random() * 5;
                
                petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
                petal.style.animationDelay = `${delay}s, 0s`;
                
                // Variem dimensiunea un pic
                let scale = Math.random() * 0.5 + 0.5;
                petal.style.transform = `scale(${scale})`;
                
                container.appendChild(petal);
            }
        }

        function addTask() {
            const input = document.getElementById('taskName'), name = input.value.trim();
            if(!name || tasks.length >= 6) return;
            tasks.push({ name: name, streak: 0, completedToday: false }); 
            input.value = ''; 
            updateUI();
        }

        function completeTask(index) { 
            if(!tasks[index].completedToday) { 
                tasks[index].completedToday = true; 
                tasks[index].streak++; 
                updateUI(); 
            } 
        }

        // Această funcție o vede doar admin/matei/test acum
        function simulateNextDay() {
            for(let i = tasks.length - 1; i >= 0; i--) {
                let t = tasks[i];
                if(!t.completedToday) {
                    if(t.streak >= 20) t.streak = 19; 
                    else if(t.streak >= 10) t.streak = 9; 
                    else t.streak = 0;
                    
                    if(t.streak === 0) { 
                        alert(`Ramura "${t.name}" s-a ofilit și a căzut! 🍂`); 
                        tasks.splice(i, 1); 
                        continue; 
                    }
                }
                t.completedToday = false;
            }
            updateUI();
        }

        // Init
        checkSession();
    </script>
</body>
</html>

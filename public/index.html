<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="moon"></div>

    <div id="login-screen" class="glass-panel">
        <h2 style="color: var(--accent-color); margin-top: 0; font-size: 2.5em; text-shadow: 0 0 15px rgba(255,183,197,0.3);">🌸 Sakura</h2>
        <input type="text" id="logUser" placeholder="Username" onkeypress="if(event.key === 'Enter') doLogin()">
        <input type="password" id="logPass" placeholder="Password" onkeypress="if(event.key === 'Enter') doLogin()">
        <button id="btnLogin" onclick="doLogin()">Log In</button>
        <span class="switch-link" onclick="showScreen('register-screen')">Don't have an account? Create your Garden</span>
    </div>

    
    <div id="register-screen" class="glass-panel" style="display: none;">
        <h2 style="color: var(--accent-color); margin-top: 0;">Create Garden</h2>
        <input type="text" id="regUser" placeholder="Username" onkeypress="if(event.key === 'Enter') doRegister()">
        <input type="password" id="regPass" placeholder="Password" onkeypress="if(event.key === 'Enter') doRegister()">
        <div style="text-align: left; margin-bottom: 5px; color: #aaa; font-size: 0.9em;">Profile color:</div>
        <input type="color" id="regColor" value="#ffb7c5" style="padding: 2px; height: 40px; cursor: pointer; border-radius: 8px;">
        <button id="btnRegister" onclick="doRegister()">Sign Up</button>
        <span class="switch-link" onclick="showScreen('login-screen')">Back to Log In</span>
    </div>

    <!-- ==============================================================
         MAIN APP SCREEN
    ============================================================== -->
    <div id="app-screen">
        
        <!-- DASHBOARD (LEFT) -->
        <div class="glass-panel dashboard">
            <div class="header-bar">
                <h2>Welcome, <span id="welcome-name" style="color: var(--accent-color);"></span>!</h2>
                <button class="btn-logout" onclick="doLogout()">Logout</button>
            </div>

            <h3 style="margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Daily Routines</h3>
            
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <input type="text" id="taskName" placeholder="Ex: Gym, Reading, Water" style="margin:0;" onkeypress="if(event.key === 'Enter') addTask()">
                <button onclick="addTask()" style="width: auto; padding: 0 25px;">Plant</button>
            </div>
            
            <!-- SCROLLABLE LIST -->
            <div class="task-list-container">
                <div id="taskList" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </div>
            
            <!-- Hidden button, only for admin/matei/test -->
            <button id="btn-simulate" onclick="simulateNextDay()" style="display: none; margin-top: 15px; background: transparent; border: 1px dashed var(--accent-color); color: var(--accent-color);">
                ⏩ Simulate Next Day (Test)
            </button>
        </div>

        <!-- PROCEDURAL SAKURA TREE (RIGHT) -->
        <div class="tree-area">
            <div class="tree-container">
                <!-- SVG draws the physical branches -->
                <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                <!-- Overlay handles the HTML Blossoms and Labels -->
                <div id="tree-overlay"></div>
                <!-- Petal particle system -->
                <div id="petalContainer"></div>
            </div>
        </div>
    </div>

    <!-- ==============================================================
         JAVASCRIPT LOGIC
    ============================================================== -->
    <script>
        // --- 1. AUTHENTICATION & PERMISSIONS ---
        const ALLOWED_ADMINS = ['admin', 'matei', 'test'];
        let currentUser = "";
        let tasks = []; // State array

        function evaluatePermissions(username) {
            currentUser = username;
            const btnSimulate = document.getElementById('btn-simulate');
            if (ALLOWED_ADMINS.includes(username.toLowerCase())) {
                btnSimulate.style.display = 'block';
            } else {
                btnSimulate.style.display = 'none';
            }
        }

        async function saveTasks() {
            const token = localStorage.getItem('sakura_token');
            if (!token) return;
            try {
                await fetch('/api/save-tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, tasks })
                });
            } catch (error) {
                console.error("Failed to sync tasks to database:", error);
            }
        }

        async function checkSession() {
            const token = localStorage.getItem('sakura_token');
            if(!token) return showScreen('login-screen');

            try {
                const res = await fetch('/api/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({token})});
                const data = await res.json();
                
                if(data.valid) {
                    document.getElementById('welcome-name').innerText = data.username;
                    tasks = data.tasks || []; // Load saved tasks
                    evaluatePermissions(data.username);
                    showScreen('app-screen');
                    updateUI(); 
                } else {
                    localStorage.removeItem('sakura_token');
                    showScreen('login-screen');
                }
            } catch (error) {
                console.error("Session verification error:", error);
                showScreen('login-screen');
            }
        }

        async function doLogin() {
            const u = document.getElementById('logUser').value.trim();
            const p = document.getElementById('logPass').value;
            const btn = document.getElementById('btnLogin');

            if(!u || !p) return alert("Enter username and password!");

            btn.disabled = true;
            btn.innerText = "Loading...";

            try {
                const res = await fetch('/api/login', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({username: u, password: p})
                });
                
                const data = await res.json();
                
                if(data.success) { 
                    localStorage.setItem('sakura_token', data.token); 
                    tasks = data.tasks || []; 
                    checkSession(); 
                } else {
                    alert(data.error || "Login error.");
                }
            } catch (error) {
                alert("Server error. Check Podman logs.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Log In";
            }
        }

        async function doRegister() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const c = document.getElementById('regColor').value;
            const btn = document.getElementById('btnRegister');

            if(!u || !p) return alert("Fill in username and password!");

            btn.disabled = true;
            btn.innerText = "Loading...";

            try {
                const res = await fetch('/api/register', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({username: u, password: p, color: c})
                });
                
                const data = await res.json();
                if(data.success) { 
                    alert(data.message); 
                    showScreen('login-screen'); 
                } else {
                    alert(data.error || "Registration error.");
                }
            } catch (error) {
                alert("Server error.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign Up";
            }
        }

        function doLogout() { localStorage.removeItem('sakura_token'); window.location.reload(); }
        
        function showScreen(id) { 
            ['login-screen', 'register-screen', 'app-screen'].forEach(s => document.getElementById(s).style.display = 'none'); 
            document.getElementById(id).style.display = (id==='app-screen')?'flex':'block'; 
        }

        // --- 2. SAKURA TREE LOGIC (UI & PROCEDURAL ENGINE) ---

        function updateUI() {
            renderDashboard();
            renderProceduralTree();
        }

        function renderDashboard() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            if(tasks.length === 0) { 
                taskList.innerHTML = '<div style="color:#888; text-align:center; padding: 20px;">No routines created yet.<br>Start growing your garden!</div>'; 
                return; 
            }

            tasks.forEach((task, index) => {
                const statusColor = task.completedToday ? '#4caf50' : 'var(--accent-color)';
                const btnStyle = task.completedToday 
                    ? `background: rgba(76, 175, 80, 0.2); border: 2px solid #4caf50; color: #4caf50;` 
                    : `background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color);`;

                taskList.innerHTML += `
                <div style="background:rgba(0,0,0,0.4); padding:15px; border-left:4px solid ${statusColor}; border-radius:10px; display:flex; justify-content:space-between; align-items:center; transition: 0.3s;">
                    <div>
                        <b style="font-size:1.1em; letter-spacing: 0.5px;">${task.name}</b><br>
                        <small style="color:#aaa;">🔥 Streak: <b>${task.streak}</b> days</small>
                    </div>
                    <button onclick="completeTask(${index})" style="width:auto; padding:8px 16px; border-radius: 6px; ${btnStyle}" ${task.completedToday ? 'disabled' : ''}>
                        ${task.completedToday ? 'Watered ✓' : 'Water 💧'}
                    </button>
                </div>`;
            });
        }

        // The Engine that draws the tree using SVG Paths
        function renderProceduralTree() {
            const svg = document.getElementById('tree-svg');
            const overlay = document.getElementById('tree-overlay');
            
            // Mathematical setup
            const width = 500; // Fixed viewBox width
            const centerX = width / 2;
            const branchVerticalSpacing = 65; // Distance between branches
            const baseTrunkHeight = 150;
            const topPadding = 120; // Space for the top blossoms to fit
            
            // Infinite growth: calculate height based on number of tasks
            const treeHeight = Math.max(500, baseTrunkHeight + (tasks.length * branchVerticalSpacing) + topPadding);
            
            // Set dynamically calculated dimensions
            svg.setAttribute('viewBox', `0 0 ${width} ${treeHeight}`);
            svg.style.height = `${treeHeight}px`;
            overlay.style.height = `${treeHeight}px`;

            let svgHTML = '';
            let overlayHTML = '';
            let totalStreak = 0;

            if (tasks.length === 0) {
                // Just a stump if no tasks
                svgHTML = `<path d="M ${centerX} ${treeHeight} Q ${centerX + 10} ${treeHeight - 50} ${centerX} ${treeHeight - 80}" stroke="var(--tree-wood)" stroke-width="26" fill="none" stroke-linecap="round" />`;
                svg.innerHTML = svgHTML;
                overlay.innerHTML = '<div style="position:absolute; bottom:90px; width:100%; text-align:center; font-size:30px;">🌱</div>';
                generatePetals(0);
                return;
            }

            // 1. Draw the Main Trunk (slightly wavy based on height)
            let trunkPath = `M ${centerX} ${treeHeight} `;
            // Start curve
            trunkPath += `Q ${centerX + 15} ${treeHeight - (treeHeight/3)} ${centerX} ${topPadding}`;
            
            svgHTML += `<path d="${trunkPath}" stroke="var(--tree-wood)" stroke-width="26" fill="none" stroke-linecap="round" />`;

            // 2. Draw Branches & Blossoms
            tasks.forEach((task, index) => {
                totalStreak += task.streak;

                // Calculate connection point on trunk
                // Branches go from bottom to top as you add more
                const branchStartY = treeHeight - baseTrunkHeight - (index * branchVerticalSpacing);
                
                // Alternate sides: left (-1) or right (1)
                const side = (index % 2 === 0) ? -1 : 1; 

                // Procedural variation for organic look
                const branchLength = 80 + Math.random() * 50; 
                const branchAngleRise = 30 + Math.random() * 40; 
                
                const branchEndX = centerX + (side * branchLength);
                const branchEndY = branchStartY - branchAngleRise;

                // Bezier Control Point (determines the curve of the branch)
                const cpX = centerX + (side * branchLength * 0.5);
                const cpY = branchStartY + 15; // dips slightly down before going up

                // SVG Branch Path
                svgHTML += `<path d="M ${centerX} ${branchStartY} Q ${cpX} ${cpY} ${branchEndX} ${branchEndY}" 
                              stroke="var(--tree-highlight)" stroke-width="8" fill="none" stroke-linecap="round" />`;

                // Calculate Visual Blossom based on Streak
                let visual = '🍂';
                let size = 1;
                let glow = 'none';
                
                if (task.streak > 0) { visual = '🌿'; size = 1.2; }
                if (task.streak >= 5) { visual = '🌸'; size = 1.4; glow = '0 0 10px rgba(255,183,197,0.6)'; }
                if (task.streak >= 15) { visual = '🌸'; size = 1.8; glow = '0 0 20px #ff5e7e'; }
                if (task.streak >= 30) { visual = '🌸'; size = 2.4; glow = '0 0 30px #ff5e7e, 0 0 15px #fff'; }

                // HTML Overlay for Emoji and Labels
                overlayHTML += `
                    <div class="branch-node" style="left: ${branchEndX}px; top: ${branchEndY}px;">
                        <div class="blossom" style="transform: scale(${size}); filter: drop-shadow(${glow});">${visual}</div>
                        <div class="task-label ${side === -1 ? 'label-left' : 'label-right'}">${task.name} <span style="color:var(--accent-color)">(${task.streak})</span></div>
                    </div>
                `;
            });

            // Inject into DOM
            svg.innerHTML = svgHTML;
            overlay.innerHTML = overlayHTML;

            // Update environment based on overall progress
            generatePetals(totalStreak);
            
            // Auto-scroll the tree container to the top so you can see new growth
            const treeArea = document.querySelector('.tree-area');
            treeArea.scrollTop = 0;
        }

        // Particle System for falling petals
        function generatePetals(streakSum) {
            const container = document.getElementById('petalContainer');
            container.innerHTML = ''; 
            
            if (streakSum === 0) return;

            // Cap visual particles to keep performance smooth, but scale them based on streak
            let petalCount = Math.min(Math.floor(streakSum * 0.8), 50);

            for(let i=0; i < petalCount; i++) {
                let petal = document.createElement('div');
                petal.className = 'petal';
                
                // Random starting x position
                petal.style.left = (Math.random() * 100) + '%';
                
                // Randomize animation timings for organic flow
                let fallDuration = (Math.random() * 6 + 4); 
                let swayDuration = (Math.random() * 3 + 2);
                let delay = Math.random() * 8; // spread out the drops
                
                petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
                petal.style.animationDelay = `${delay}s, 0s`;
                
                // Vary petal size
                let scale = Math.random() * 0.6 + 0.4;
                petal.style.transform = `scale(${scale})`;
                
                container.appendChild(petal);
            }
        }

        function addTask() {
            const input = document.getElementById('taskName');
            const name = input.value.trim();
            
            // CAP REMOVED: No more limits on tasks!
            if(!name) return; 
            
            tasks.push({ name: name, streak: 0, completedToday: false }); 
            input.value = ''; 
            updateUI();
            saveTasks(); 
        }

        function completeTask(index) { 
            if(!tasks[index].completedToday) { 
                tasks[index].completedToday = true; 
                tasks[index].streak++; 
                updateUI(); 
                saveTasks(); 
            } 
        }

        function simulateNextDay() {
            // Loop backward so we can safely remove dead branches without breaking index
            for(let i = tasks.length - 1; i >= 0; i--) {
                let t = tasks[i];
                if(!t.completedToday) {
                    // Penalty system
                    if(t.streak >= 30) t.streak = 25; 
                    else if(t.streak >= 15) t.streak = 10; 
                    else if(t.streak >= 5) t.streak = 2;
                    else t.streak = 0;
                    
                    if(t.streak === 0) { 
                        alert(`Branch "${t.name}" withered and fell! 🍂`); 
                        tasks.splice(i, 1); 
                        continue; 
                    }
                }
                // Reset flag for the new day
                t.completedToday = false;
            }
            updateUI();
            saveTasks(); 
        }

        // Init App
        checkSession();
    </script>
</body>
</html>
